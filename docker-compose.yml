services:
  minecraft:
    image: itzg/minecraft-server:latest
    container_name: minecraft-server
    restart: unless-stopped
    tty: true
    stdin_open: true
    ports:
      # Minecraft Java Edition (TCP)
      - "${JAVA_PORT:-25565}:25565/tcp"
      # Minecraft Bedrock Edition via GeyserMC (UDP + TCP for NetherNet WebRTC signaling)
      - "${BEDROCK_PORT:-19132}:19132/udp"
      - "${BEDROCK_PORT:-19132}:19132/tcp"
      # RCON remote administration console (bound to localhost for security)
      - "127.0.0.1:${RCON_PORT:-25575}:25575/tcp"
    environment:
      EULA: "TRUE"
      TYPE: "${TYPE:-PAPER}"
      VERSION: "${MC_VERSION:-LATEST}"
      MEMORY: "${MEMORY:-4G}"
      SERVER_NAME: "${SERVER_NAME:-Crossplay Minecraft Server}"
      MOTD: "${MOTD:-Welcome to our Server | Java & Bedrock Crossplay}"
      DIFFICULTY: "${DIFFICULTY:-normal}"
      MAX_PLAYERS: "${MAX_PLAYERS:-20}"
      MODE: "${MODE:-survival}"
      PVP: "${PVP:-true}"
      ONLINE_MODE: "${ONLINE_MODE:-TRUE}"
      ENFORCE_SECURE_PROFILE: "${ENFORCE_SECURE_PROFILE:-false}"
      VIEW_DISTANCE: "${VIEW_DISTANCE:-10}"
      SIMULATION_DISTANCE: "${SIMULATION_DISTANCE:-8}"
      ENABLE_COMMAND_BLOCK: "${ENABLE_COMMAND_BLOCK:-true}"
      SPAWN_PROTECTION: "${SPAWN_PROTECTION:-0}"
      # RCON console access
      ENABLE_RCON: "true"
      RCON_PORT: "25575"
      RCON_PASSWORD: "${RCON_PASSWORD:-ChangeThisPassword123!}"
      # Automatic download of official GeyserMC and Floodgate plugins
      PLUGINS: "https://download.geysermc.org/v2/projects/geyser/versions/latest/builds/latest/downloads/spigot,https://download.geysermc.org/v2/projects/floodgate/versions/latest/builds/latest/downloads/spigot"
      # Aikar's optimized JVM garbage collection flags for Paper
      JVM_OPTS: >-
        -XX:+UseG1GC
        -XX:+ParallelRefProcEnabled
        -XX:MaxGCPauseMillis=200
        -XX:+UnlockExperimentalVMOptions
        -XX:+DisableExplicitGC
        -XX:+AlwaysPreTouch
        -XX:G1NewSizePercent=30
        -XX:G1MaxNewSizePercent=40
        -XX:G1ReservePercent=20
        -XX:G1HeapWastePercent=5
        -XX:G1MixedGCCountTarget=4
        -XX:InitiatingHeapOccupancyPercent=15
        -XX:G1MixedGCLiveThresholdPercent=90
        -XX:G1RSetUpdatingPauseTimePercent=5
        -XX:SurvivorRatio=32
        -XX:+PerfDisableSharedMem
        -XX:MaxTenuringThreshold=1
    volumes:
      - ./data:/data
      - ./plugins:/plugins:ro
    healthcheck:
      test: ["CMD", "mc-health"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 90s
